[project]
name = "learning-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bcrypt>=4.1.2",
    "pandas>=1.4.0,<3",
    "nicegui>=3.7.1",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "uvicorn[standard]>=0.27.0",
    "requests>=2.31.0",
    "opentelemetry-api>=1.28.2",
    "opentelemetry-sdk>=1.28.2",
    "opentelemetry-exporter-otlp-proto-http>=1.28.2",
    "opentelemetry-instrumentation-fastapi>=0.49b2",
    "opentelemetry-instrumentation-httpx>=0.49b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "mypy>=1.11.2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-anyio>=0.0.0",
    "playwright>=1.52.0",
    "pillow>=10.4.0",
    "pip-audit>=2.9.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
# Keep this ruleset architecture-focused and low-noise:
# - import hygiene/boundaries (`I`, `TID`)
# - undefined names (`F821`)
# - risky exception handling (`BLE`)
# - avoid ad-hoc print debugging in app code (`T20`)
# - function complexity guardrails (`C901`, `PLR091x`)
select = ["I", "F821", "BLE", "TID", "T20", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
"scripts/**/*.py" = ["T20"]
# Tier 2 (UI composition modules): allow slightly looser complexity while
# we continue extracting orchestration into controller/orchestration/actions.
"frontend/ui/nicegui/pages/*/page.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"frontend/ui/nicegui/pages/*/sections.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"frontend/ui/nicegui/pages/*/dialogs.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"frontend/ui/nicegui/core/errors.py" = ["BLE001"]
"frontend/ui/nicegui/pages/explore/page.py" = ["C901", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2
order-by-type = false
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
# Tier 1 (services/controllers/orchestration/reducers): stricter default.
max-complexity = 25

[tool.ruff.lint.pylint]
# Tier 1 (services/controllers/orchestration/reducers): stricter default.
max-args = 10
max-branches = 20
max-returns = 8
max-statements = 100

[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = [
    "backend.services.*",
    "frontend.ui.nicegui.services.*",
    "frontend.ui.nicegui.pages.*.state",
    "frontend.ui.nicegui.pages.*.view_model",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "frontend.ui.nicegui.pages.paths.page",
    "frontend.ui.nicegui.pages.paths.controller",
    "frontend.ui.nicegui.pages.paths.dialogs",
    "frontend.ui.nicegui.pages.paths.view_model",
    "frontend.ui.nicegui.pages.learning.page",
    "frontend.ui.nicegui.pages.learning.view_model",
    "frontend.ui.nicegui.pages.home.helpers_compat",
]
ignore_errors = true
