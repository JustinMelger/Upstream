[theme]
base = "light"
showSidebarBorder = true
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"

[theme.light]
primaryColor = "#0f5c6e"
backgroundColor = "#f4f2ee"
secondaryBackgroundColor = "#e9eef2"
textColor = "#0f172a"
borderColor = "#c7cfd8"
linkColor = "#0f5c6e"
linkUnderline = false

[theme.light.sidebar]
backgroundColor = "#e5ecf2"
secondaryBackgroundColor = "#dfe7ee"
textColor = "#0f172a"
borderColor = "#c7cfd8"

[theme.dark]
primaryColor = "#6bc1d4"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#111827"
textColor = "#e5e7eb"
borderColor = "#263241"
linkColor = "#6bc1d4"
linkUnderline = false

[theme.dark.sidebar]
backgroundColor = "#0f1522"
secondaryBackgroundColor = "#0c1320"
textColor = "#e5e7eb"
borderColor = "#263241"

[server]
headless = true
