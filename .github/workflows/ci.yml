name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/badges/coverage.svg"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/badges/coverage.svg"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy backend/services frontend/ui/nicegui/services frontend/ui/nicegui/core frontend/ui/nicegui/pages/ai_curator/ui_glue.py

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run pip-audit
        run: uv run pip-audit

  migrations:
    runs-on: ubuntu-latest
    needs: security
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://learning_platform:learning_platform@127.0.0.1:5432/learning_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

  unit:
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://learning_platform:learning_platform@127.0.0.1:5432/learning_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run frontend architecture guard tests
        run: uv run pytest tests/frontend/ui/nicegui/test_page_package_exports.py tests/frontend/ui/nicegui/test_page_package_layout.py

      - name: Run architecture marker tests
        run: uv run pytest -m architecture

      - name: Run unit tests
        run: |
          COVERAGE_FILE=coverage.unit uv run coverage run -m pytest -m unit
          test -f coverage.unit
          ls -la coverage.* || true

      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://learning_platform:learning_platform@127.0.0.1:5432/learning_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: |
          COVERAGE_FILE=coverage.integration uv run coverage run -m pytest -m integration
          test -f coverage.integration
          ls -la coverage.* || true

      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage.integration

  coverage_report:
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Download unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit

      - name: Download integration coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration

      - name: Run tests with coverage
        run: |
          uv run coverage combine coverage.unit coverage.integration
          uv run coverage xml -o coverage.xml
          uv run coverage report --show-missing --skip-covered

      - name: Generate coverage badge
        run: uv run python scripts/gen_coverage_badge.py coverage.xml docs/badges/coverage.svg

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            docs/badges/coverage.svg

  release:
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

  coverage_badge:
    runs-on: ubuntu-latest
    needs: [coverage_report, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: /tmp/coverage_artifacts

      - name: Sync to Latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/badges
          cp -f /tmp/coverage_artifacts/docs/badges/coverage.svg docs/badges/coverage.svg
          git add docs/badges/coverage.svg
          if git diff --cached --quiet; then
            echo "No badge changes to commit."
            exit 0
          fi
          git commit -m "chore(ci): update coverage badge"
          git push
