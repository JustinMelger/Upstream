name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_react_test
          POSTGRES_USER: react_test
          POSTGRES_PASSWORD: react_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U react_test -d learning_react_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://react_test:react_test@127.0.0.1:5432/learning_react_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy backend
      - run: uv run lint-imports
      - name: Verify populated migration
        run: |
          PGPASSWORD=react_test createdb -h 127.0.0.1 -U react_test learning_migration_test
          E2E_DATABASE_IS_DISPOSABLE=1 DATABASE_URL=postgresql+asyncpg://react_test:react_test@127.0.0.1:5432/learning_migration_test uv run python -m scripts.verify_react_migration
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/backend --cov=backend --cov-report=xml
      - run: uv run python -m scripts.export_openapi --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck && npm run test && npm run build
      - run: npm run api:generate && git diff --exit-code -- src/lib/api/generated.ts
  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_browser_test
          POSTGRES_USER: react_test
          POSTGRES_PASSWORD: react_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U react_test -d learning_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://react_test:react_test@127.0.0.1:5432/learning_browser_test
      E2E_DATABASE_IS_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --group dev --frozen && uv run alembic upgrade head
      - run: npm ci --prefix frontend/react
      - run: npx --prefix frontend/react playwright install --with-deps chromium
      - run: uv run python -m scripts.seed_react_demo
      - run: npm run e2e --prefix frontend/react
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/react/test-results

  visual:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned browser environment
        run: docker build -t learning-visual -f frontend/react/Dockerfile.visual frontend/react
      - name: Compare reviewed baselines
        run: docker run --rm --ipc=host -v "$PWD/frontend/react/test-results:/app/test-results" learning-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-differences
          path: frontend/react/test-results
