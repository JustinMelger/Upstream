name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/badges/coverage.svg"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/badges/coverage.svg"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format
        run: uv run ruff format --check .

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run pip-audit
        run: uv run pip-audit

  migrations:
    runs-on: ubuntu-latest
    needs: security
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://learning_platform:learning_platform@localhost:5432/learning_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

  unit:
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://learning_platform:learning_platform@localhost:5432/learning_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run unit tests
        run: uv run pytest -m unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://learning_platform:learning_platform@localhost:5432/learning_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest -m integration

  coverage:
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://learning_platform:learning_platform@localhost:5432/learning_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --no-install-project --group dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: uv run pytest --cov=backend --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Generate coverage badge
        run: uv run python scripts/gen_coverage_badge.py coverage.xml docs/badges/coverage.svg

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            docs/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.svg
          if git diff --cached --quiet; then
            echo "No badge changes to commit."
            exit 0
          fi
          git commit -m "chore(ci): update coverage badge"
          git push

  release:
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
