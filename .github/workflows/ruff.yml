name: Ruff

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff check
        run: |
          ruff check --show-fixes || echo "run ruff check --fix in IDE"
          ruff check --select I --statistics
          ruff check --statistics
