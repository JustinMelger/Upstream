services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=learning_platform
      - POSTGRES_USER=learning_platform
      - POSTGRES_PASSWORD=learning_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_platform -d learning_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://learning_platform:learning_platform@postgres:5432/learning_platform
      - SESSION_DAYS=30
      - BOOTSTRAP_ADMIN_USERNAME=admin
      - BOOTSTRAP_ADMIN_PASSWORD=admin
      - OTEL_ENABLED=1
      - OTEL_SERVICE_NAME=learning-hub-api
      - OTEL_SERVICE_VERSION=0.1.0
      - OTEL_DEPLOYMENT_ENVIRONMENT=docker
      - OTEL_TRACES_SAMPLE_RATIO=1.0
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://host.docker.internal:4318/v1/metrics

  ui:
    build: .
    command: ["python", "-m", "frontend.ui.nicegui.main"]
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      - BACKEND_URL=http://api:8000
      - NICEGUI_STORAGE_SECRET=dev-storage-secret-change-me

volumes:
  postgres_data:
