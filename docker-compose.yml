services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: learning_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_platform -d learning_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: ${API_IMAGE:-upstream-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://learning_platform:${POSTGRES_PASSWORD}@postgres:5432/learning_platform
  api:
    image: ${API_IMAGE:-upstream-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://learning_platform:${POSTGRES_PASSWORD}@postgres:5432/learning_platform
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_ROOT_PATH: /api
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BROWSER_SECRET: ${BROWSER_SECRET:?Set BROWSER_SECRET in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  ui:
    image: ${UI_IMAGE:-upstream-ui:local}
    build:
      context: .
      dockerfile: frontend/react/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
