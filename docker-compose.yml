services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - COURSES_CSV=/app/courses.csv
      - DATABASE_PATH=/app/learning_hub.db
      - SESSION_DAYS=30
      - BOOTSTRAP_ADMIN_USERNAME=admin
      - BOOTSTRAP_ADMIN_PASSWORD=admin

  ui:
    build: .
    working_dir: /app/frontend
    command: ["streamlit", "run", "Home.py", "--server.port=8502", "--server.address=0.0.0.0"]
    ports:
      - "8502:8502"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
      - COOKIE_SECURE=false
