repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-scoped
        name: mypy (scoped project gate)
        entry: uv run mypy backend
        language: system
        pass_filenames: false
