repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-scoped
        name: mypy (scoped project gate)
        entry: uv run mypy backend/services frontend/ui/nicegui/services frontend/ui/nicegui/core frontend/ui/nicegui/pages/ai_curator/ui_glue.py
        language: system
        pass_filenames: false
      - id: mypy-core-strict
        name: mypy (core strict)
        entry: uv run mypy frontend/ui/nicegui/core --strict
        language: system
        pass_filenames: false
